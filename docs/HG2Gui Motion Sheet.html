document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ap:#93251D;\n  --hue-magenta:#B03A6E; --hue-magenta-cap:#7F2A4D;\n  --hue-purple:#8E4FA8;  --hue-purple-cap:#653578;\n  --hue-blue:#2E6FB7;    --hue-blue-cap:#1E4E85;\n\n  /* Ink washes — the only transparency in the system */\n  --ink-04:rgba(30,26,23,.04);\n  --ink-09:rgba(30,26,23,.09);\n  --ink-10:rgba(30,26,23,.10);\n  --ink-14:rgba(30,26,23,.14);\n  --ink-16:rgba(30,26,23,.16);\n  --ink-28:rgba(30,26,23,.28);\n  --ink-45:rgba(30,26,23,.45);\n  --ink-50:rgba(30,26,23,.50);\n  --ink-55:rgba(30,26,23,.55);\n  --ink-60:rgba(30,26,23,.60);\n  --ink-66:rgba(30,26,23,.66);\n  --ink-72:rgba(30,26,23,.72);\n  --ink-78:rgba(30,26,23,.78);\n\n  /* Semantic aliases */\n  --surface-page:var(--page);\n  --surface-tile:var(--ink-09);        /* the soft record tile — the one non-capsule surface */\n  --surface-well:var(--ink-14);        /* search well, inactive capsule */\n  --surface-active:var(--ink);         /* selected / open capsule */\n  --text-body:var(--ink-78);\n  --text-strong:var(--ink);\n  --text-muted:var(--ink-55);\n  --text-on-hue:var(--white);\n  --text-on-ink:var(--yellow-bright);\n  --action-primary:var(--hue-red);     /* acquire */\n  --action-primary-cap:var(--hue-red-cap);\n  --action-done:var(--hue-teal);       /* acquired, receipts */\n  --action-done-cap:var(--hue-teal-cap);\n  --do:var(--hue-teal);\n  --dont:var(--hue-red);\n  --link:var(--hue-violet);\n  --link-hover:var(--ink);\n}\n<\u002Fstyle>\n<style>/* One family. Weight, case and tracking carry every distinction. */\n:root{\n  --font-core:\"Jost\",Futura,\"Century Gothic\",Helvetica,sans-serif;\n\n  --weight-body:600;\n  --weight-label:700;\n  --weight-capsule:800;\n  --weight-display:900;\n\n  --size-display:clamp(56px,9vw,140px);\n  --size-headline:clamp(34px,4.6vw,60px);\n  --size-section:40px;\n  --size-lead:25px;\n  --size-body-lg:19px;\n  --size-body:17px;\n  --size-body-sm:15px;\n  --size-capsule-lg:16px;\n  --size-capsule:15px;\n  --size-capsule-sm:11px;\n  --size-cap-text:10px;\n  --si -leading-tight) var(--font-core);\n  --type-body:var(--weight-body) var(--size-body)/var(--leading-body-loose) var(--font-core);\n}\n\n/* Spacing is loose and odd-numbered — set by eye against the printed spread, not a 4px grid. */\n:root{\n  --space-1:4px;\n  --space-2:7px;    /* receipt / fact pill gaps */\n  --space-3:9px;    /* the canonical gap between capsules in a stack */\n  --space-4:12px;\n  --space-5:16px;\n  --space-6:20px;\n  --space-7:26px;\n  --space-8:34px;\n  --space-9:44px;\n  --space-10:76px;  /* between style-guide sections */\n\n  --page-pad-x:44px;\n  --page-pad-top:34px;\n  --page-pad-bottom:140px;\n  --measure:640px;      /* body copy max width */\n  --measure-wide:1000px;/* catalogue column */\n  --measure-tile:820px; /* record tile */\n\n  --indent-child:36px;  /* one accordion level */\n  --indent-step:9px;    /* cascade step, cycling 0..4 */\n\n  /* Capsule geometry — left padding is ~2x the right */\n  --capsule-pad-sm:8px 8px 8px 16px;\n  --capsule-pad-md:12px 10px 12px 24px;\n  --capsule-pad-lg:13px 11px 13px 26px;\n  --capsule-pad-xl:16px 16px 16px 32px;\n  --cap-size-sm:18px;\n  --cap-size-md:24px;\n  --cap-size-lg:26px;\n\n  --radius-capsule:999px;\n  --radius-tile:26px;\n  --radius-plate:18px;\n  --radius-note:20px;\n\n  --border:none; /* @kind other */\n  --shadow:none;\n}\n\n/* Capsules unfold left to right. Nothing fades, nothing idles. */\n:root{\n  --ease-unfold:cubic-bezier(0,.9,.1,1); /* @kind other */\n  --dur-unfold:420ms; /* @kind other */\n  --dur-extend:420ms; /* @kind other */\n  --stagger-row:26ms; /* @kind other */\n  --stagger-cap:20; /* @kind other */   /* rows after which stagger stops growing */\n}\n@keyframes az-unfold{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}\n@keyframes az-unfold-row{0%{clip-path:inset(0 100% 0 0);opacity:1}100%{clip-path:inset(0 0 0 0);opacity:1}}\n\n/* Minimal resets. Consumers style with tokens, not with classes. */\nhtml,body{margin:0;padding:0}\nbody{background:var(--page);color:var(--ink);font-family:var(--font-core);-webkit-font-smoothing:antialiased}\na{color:var(--link);text-decoration:none}\na:hover{color:var(--link-hover)}\nbutton{font-family:inherit;border:none;cursor:pointer;transition:none}\ninput{font-family:inherit}\n::selection{background:var(--ink);color:var(--yellow-bright)}\n.az-hide-scrollbar{scrollbar-width:none;-ms-overflow-style:none}\n.az-hide-scrollbar::-webkit-scrollbar{display:none}\n\n<\u002Fstyle>\n<script src=\"2267a41c-5d68-4e75-bd56-be36ef19e29b\"><\u002Fscript>\n<style>\n  body{margin:0;background:var(--page-gradient);}\n  a{color:var(--link);} a:hover{color:var(--link-hover);}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width:1180px;margin:0 auto;padding:56px 44px 140px;font-family:var(--font-core);color:var(--ink);display:flex;flex-direction:column;gap:44px;\">\n\n  <div style=\"display:flex;flex-direction:column;gap:14px;max-width:700px;\">\n    <div style=\"font:800 11px/1 var(--font-core);letter-spacing:.28em;text-transform:uppercase;color:var(--ink-55);\">HG2Gui — motion sheet<\u002Fdiv>\n    <div style=\"font:900 58px/0.84 var(--font-core);letter-spacing:-.03em;text-transform:uppercase;\">Every animation, playing<\u002Fdiv>\n    <p style=\"margin:0;font:var(--type-body);color:var(--ink-78);text-wrap:pretty;\">Sixteen specimens, each running its real timing and curve. They play once on arrival — tap any tile to run it again, or play the whole sheet from the top.<\u002Fp>\n    <div style=\"display:flex;gap:7px;align-items:center;\">\n      <button sc-camel-on-click=\"{{ playAll }}\" style=\"border-radius:999px;box-sizing:border-box;padding:13px 22px;background:var(--ink);font:800 11px/1 var(--font-core);letter-spacing:.14em;text-transform:uppercase;color:var(--yellow-bright);\">Play everything<\u002Fbutton>\n      <span style=\"font:800 9px/1 var(--font-core);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-45);\">{{ note }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:16px;\">\n    <div style=\"font:800 11px/1 var(--font-core);letter-spacing:.28em;text-transform:uppercase;color:var(--ink-55);\">The capsule<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;\">\n\n      <button sc-camel-on-click=\"{{ plays.unfold }}\" data-tile=\"unfold\" style=\"text-align:left;background:var(--ink-09);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px;\">\n        <div data-stage=\"unfold\" style=\"position:relative;height:150px;border-radius:20px;background:var(--page-gradient);overflow:hidden;\">\n          <div data-el=\"a\" style=\"position:absolute;left:20px;top:62px;height:26px;width:72%;border-radius:999px;background:var(--hue-violet);\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:5px;\">\n          <span style=\"font:900 17px/1 var(--font-core);letter-spacing:-.01em;text-transform:uppercase;\">Unfold<\u002Fspan>\n          <span style=\"font:600 13px/1.4 var(--font-core);color:var(--ink-78);\">420ms · cubic-bezier(0, .9, .1, 1) · it grows in length, keeping both tips<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fbutton>\n\n      <button sc-camel-on-click=\"{{ plays.stagger }}\" data-tile=\"stagger\" style=\"text-align:left;background:var(--ink-09);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px;\">\n        <div data-stage=\"stagger\" style=\"position:relative;height:150px;border-radius:20px;background:var(--page-gradient);overflow:hidden;padding:20px;display:flex;flex-direction:column;gap:9px;\">\n          <div data-el=\"a\" style=\"height:20px;width:82%;border-radius:999px;background:var(--hue-cyan);\"><\u002Fdiv>\n          <div data-el=\"a\" style=\"height:20px;width:68%;border-radius:999px;background:var(--hue-amber);\"><\u002Fdiv>\n          <div data-el=\"a\" style=\"height:20px;width:90%;border-radius:999px;background:var(--hue-teal);\"><\u002Fdiv>\n          <div data-el=\"a\" style=\"height:20px;width:62%;border-radius:999px;background:var(--hue-magenta);\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:5px;\">\n          <span style=\"font:900 17px/1 var(--font-core);letter-spacing:-.01em;text-transform:uppercase;\">Row stagger<\u002Fspan>\n          <span style=\"font:600 13px/1.4 var(--font-core);color:var(--ink-78);\">26ms apart, down the stack — each row grows in length, tips intact<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fbutton>\n\n      <button sc-camel-on-click=\"{{ plays.extend }}\" data-tile=\"extend\" style=\"text-align:left;background:var(--ink-09);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px;\">\n        <div data-stage=\"extend\" style=\"position:relative;height:150px;border-radius:20px;background:var(--page-gradient);overflow:hidden;padding:20px;display:flex;flex-direction:column;gap:9px;\">\n          <div data-el=\"host\" style=\"height:24px;width:62%;border-radius:999px;background:var(--hue-green);\"><\u002Fdiv>\n          <div data-el=\"kid\" style=\"height:20px;width:70%;margin-left:24px;border-radius:999px;background:var(--hue-blue);\"><\u002Fdiv>\n          <div data-el=\"kid\" style=\"height:20px;width:58%;margin-left:24px;border-radius:999px;background:var(--hue-purple);\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:5px;\">\n          <span style=\"font:900 17px/1 var(--font-core);letter-spacing:-.01em;text-transform:uppercase;\">Press to extend<\u002Fspan>\n          <span style=\"font:600 13px/1.4 var(--font-core);color:var(--ink-78);\">The pressed capsule lengthens to full width; its contents grow in underneath<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fbutton>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:16px;\">\n    <div style=\"font:800 11px/1 var(--font-core);letter-spacing:.28em;text-transform:uppercase;color:var(--ink-55);\">The menu<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;\">\n\n      <button sc-camel-on-click=\"{{ plays.enter }}\" data-tile=\"enter\" style=\"text-align:left;background:var(--ink-09);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px;\">\n        <div data-stage=\"enter\" style=\"position:relative;height:150px;border-radius:20px;background:var(--page-gradient);overflow:hidden;\">\n          <div data-el=\"row\" data-row=\"3\" style=\"position:absolute;left:0;bottom:76px;height:16px;width:76%;border-radius:999px;background:var(--hue-violet);\"><\u002Fdiv>\n          <div data-el=\"row\" data-row=\"2\" style=\"position:absolute;left:0;bottom:56px;height:16px;width:64%;border-radius:999px;background:var(--hue-amber);\"><\u002Fdiv>\n          <div data-el=\"row\" data-row=\"1\" style=\"position:absolute;left:0;bottom:36px;height:16px;width:82%;border-radius:999px;background:var(--hue-teal);\"><\u002Fdiv>\n          <div data-el=\"row\" data-row=\"0\" style=\"position:absolute;left:0;bottom:16px;height:16px;width:58%;border-radius:999px;background:var(--hue-magenta);\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:5px;\">\n          <span style=\"font:900 17px/1 var(--font-core);letter-spacing:-.01em;text-transform:uppercase;\">Stack arrives<\u002Fspan>\n          <span style=\"font:600 13px/1.4 var(--font-core);color:var(--ink-78);\">One column, one clock — the whole stack slides in together, no per-row stagger. The top pill alone overshoots and corrects once it's landed.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fbutton>\n\n      <button sc-camel-on-click=\"{{ plays.leave }}\" data-tile=\"leave\" style=\"text-align:left;background:var(--ink-09);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px;\">\n        <div data-stage=\"leave\" style=\"position:relative;height:150px;border-radius:20px;background:var(--page-gradient);overflow:hidden;\">\n          <div data-el=\"sib\" style=\"position:absolute;left:0;bottom:76px;height:16px;width:76%;border-radius:999px;background:var(--hue-violet);\"><\u002Fdiv>\n          <div data-el=\"sib\" style=\"position:absolute;left:0;bottom:56px;height:16px;width:64%;border-radius:999px;background:var(--hue-amber);\"><\u002Fdiv>\n          <div data-el=\"host\" style=\"position:absolute;left:0;bottom:36px;height:16px;width:82%;border-radius:999px;background:var(--ink);\"><\u002Fdiv>\n          <div data-el=\"sib\" style=\"position:absolute;left:0;bottom:16px;height:16px;width:58%;border-radius:999px;background:var(--hue-magenta);\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:5px;\">\n          <span style=\"font:900 17px/1 var(--font-core);letter-spacing:-.01em;text-transform:uppercase;\">Stack leaves<\u002Fspan>\n          <span style=\"font:600 13px/1.4 var(--font-core);color:var(--ink-78);\">140ms · a host is chosen, the rest sway off to the left — the exact reverse of arriving<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fbutton>\n\n      <button sc-camel-on-click=\"{{ plays.drop }}\" data-tile=\"drop\" style=\"text-align:left;background:var(--ink-09);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px;\">\n        <div data-stage=\"drop\" style=\"position:relative;height:150px;border-radius:20px;background:var(--page-gradient);overflow:hidden;\">\n          <div data-el=\"host\" style=\"position:absolute;left:-40%;bottom:76px;height:16px;width:82%;border-radius:999px;background:var(--ink);\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:5px;\">\n          <span style=\"font:900 17px/1 var(--font-core);letter-spacing:-.01em;text-transform:uppercase;\">Host drops<\u002Fspan>\n          <span style=\"font:600 13px/1.4 var(--font-core);color:var(--ink-78);\">140ms · it drops to the bottom edge like it weighs something, and stays there<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fbutton>\n\n      <button sc-camel-on-click=\"{{ plays.cascade }}\" data-tile=\"cascade\" style=\"text-align:left;background:var(--ink-09);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px;\">\n        <div data-stage=\"cascade\" style=\"position:relative;height:150px;border-radius:20px;background:var(--page-gradient);overflow:hidden;\">\n          <div style=\"position:absolute;z-index:100;left:-40%;bottom:16px;height:16px;width:82%;border-radius:999px;background:var(--ink);\"><\u002Fdiv>\n          <div data-el=\"kid\" data-i=\"0\" style=\"position:absolute;left:30%;bottom:16px;height:16px;width:52%;border-radius:999px;background:var(--hue-cyan);\"><\u002Fdiv>\n          <div data-el=\"kid\" data-i=\"1\" style=\"position:absolute;left:30%;bottom:16px;height:16px;width:52%;border-radius:999px;background:var(--hue-cyan);\"><\u002Fdiv>\n          <div data-el=\"kid\" data-i=\"2\" style=\"position:absolute;left:30%;bottom:16px;height:16px;width:52%;border-radius:999px;background:var(--hue-cyan);\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:5px;\">\n          <span style=\"font:900 17px/1 var(--font-core);letter-spacing:-.01em;text-transform:uppercase;\">Children cascade<\u002Fspan>\n          <span style=\"font:600 13px/1.4 var(--font-core);color:var(--ink-78);\">360° hinged on alternating ends · lift in the last 10% · 173ms each, in turn<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fbutton>\n\n      <button sc-camel-on-click=\"{{ plays.handoff }}\" data-tile=\"handoff\" style=\"text-align:left;background:var(--ink-09);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px;\">\n        <div data-stage=\"handoff\" style=\"position:relative;height:150px;border-radius:20px;background:var(--page-gradient);overflow:hidden;\">\n          <div style=\"position:absolute;z-index:100;left:-40%;bottom:16px;height:16px;width:82%;border-radius:999px;background:var(--ink);\"><\u002Fdiv>\n          <div data-el=\"pick\" style=\"position:absolute;left:30%;bottom:36px;height:16px;width:52%;border-radius:999px;background:var(--hue-orange);\"><\u002Fdiv>\n          <div data-el=\"sib\" style=\"position:absolute;left:30%;bottom:56px;height:16px;width:52%;border-radius:999px;background:var(--hue-orange);\"><\u002Fdiv>\n          <div data-el=\"sib\" style=\"position:absolute;left:30%;bottom:76px;height:16px;width:52%;border-radius:999px;background:var(--hue-orange);\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:5px;\">\n          <span style=\"font:900 17px/1 var(--font-core);letter-spacing:-.01em;text-transform:uppercase;\">Hand-off<\u002Fspan>\n          <span style=\"font:600 13px/1.4 var(--font-core);color:var(--ink-78);\">The same stretch·snap·fly·jiggle — but the last third of the fall swoops back to land as the breadcrumb<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fbutton>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:16px;\">\n    <div style=\"font:800 11px/1 var(--font-core);letter-spacing:.28em;text-transform:uppercase;color:var(--ink-55);\">Running a command<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;\">\n\n      <button sc-camel-on-click=\"{{ plays.struggle }}\" data-tile=\"struggle\" style=\"text-align:left;background:var(--ink-09);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px;\">\n        <div data-stage=\"struggle\" style=\"position:relative;height:150px;border-radius:20px;background:var(--page-gradient);overflow:hidden;\">\n          <div style=\"position:absolute;left:0;bottom:76px;height:16px;width:34%;border-radius:999px;background:var(--hue-cyan);\"><\u002Fdiv>\n          <div data-el=\"pill\" style=\"position:absolute;left:0;bottom:56px;height:16px;width:30%;border-radius:999px;background:var(--hue-cyan);\"><\u002Fdiv>\n          <div style=\"position:absolute;left:0;bottom:36px;height:16px;width:28%;border-radius:999px;background:var(--hue-cyan);\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:5px;\">\n          <span style=\"font:900 17px/1 var(--font-core);letter-spacing:-.01em;text-transform:uppercase;\">Stretch · snap · fly · jiggle · fall<\u002Fspan>\n          <span style=\"font:600 13px/1.4 var(--font-core);color:var(--ink-78);\">Stretches right, snaps in from the left, then flies right at that same retracting speed into the far edge. (Neighbours held still on purpose, so the one pill's motion is easy to see.)<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fbutton>\n\n      <button sc-camel-on-click=\"{{ plays.perimeter }}\" data-tile=\"perimeter\" style=\"text-align:left;background:var(--ink-09);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px;\">\n        <div data-stage=\"perimeter\" style=\"position:relative;height:150px;border-radius:20px;background:var(--page-gradient);overflow:hidden;\">\n          <div data-el=\"b\" style=\"position:absolute;background:var(--hue-cyan);\"><\u002Fdiv>\n          <div data-el=\"r\" style=\"position:absolute;background:var(--hue-cyan);\"><\u002Fdiv>\n          <div data-el=\"t\" style=\"position:absolute;background:var(--hue-cyan);\"><\u002Fdiv>\n          <div data-el=\"l\" style=\"position:absolute;background:var(--hue-cyan);\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:5px;\">\n          <span style=\"font:900 17px/1 var(--font-core);letter-spacing:-.01em;text-transform:uppercase;\">Run the perimeter<\u002Fspan>\n          <span style=\"font:600 13px/1.4 var(--font-core);color:var(--ink-78);\">280ms an edge · bottom, right, top, left — counter-clockwise, closing on itself<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fbutton>\n\n      <button sc-camel-on-click=\"{{ pla ;white-space:nowrap;\">Search<\u002Fdiv>\n          <div data-el=\"mid\" style=\"position:absolute;top:60px;left:18px;height:6px;width:52%;border-radius:999px;background:var(--hue-red);\"><\u002Fdiv>\n          <div data-el=\"front\" style=\"position:absolute;top:96px;left:18px;font:900 26px/0.9 var(--font-core);letter-spacing:-.02em;text-transform:uppercase;\">ripgrep<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:5px;\">\n          <span style=\"font:900 17px/1 var(--font-core);letter-spacing:-.01em;text-transform:uppercase;\">Parallax<\u002Fspan>\n          <span style=\"font:600 13px/1.4 var(--font-core);color:var(--ink-78);\">Depth is speed · wash 0.2, rod 0.5, text 1.0 — nothing is blurred to fake it<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fbutton>\n\n      <button sc-camel-on-click=\"{{ plays.job }}\" data-tile=\"job\" style=\"text-align:left;background:var(--ink-09);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px;\">\n        <div data-stage=\"job\" style=\"position:relative;height:150px;border-radius:20px;background:var(--page-gradient);overflow:hidden;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:10px;\">\n          <span style=\"font:800 9px/1 var(--font-core);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-55);\">./gradlew assembleDebug<\u002Fspan>\n          <div style=\"position:relative;height:34px;border-radius:999px;background:var(--ink-14);overflow:hidden;\">\n            <div data-el=\"fill\" style=\"position:absolute;inset:0;background:var(--hue-amber);\"><\u002Fdiv>\n            <span style=\"position:absolute;left:20px;top:11px;font:800 11px/1 var(--font-core);letter-spacing:.09em;text-transform:uppercase;color:var(--white);\">Building<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:5px;\">\n          <span style=\"font:900 17px/1 var(--font-core);letter-spacing:-.01em;text-transform:uppercase;\">A job running<\u002Fspan>\n          <span style=\"font:600 13px/1.4 var(--font-core);color:var(--ink-78);\">The same unfold, slowed to the length of the work — so there is still no spinner<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fbutton>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:9px;max-width:700px;\">\n    <div style=\"font:800 11px/1 var(--font-core);letter-spacing:.28em;text-transform:uppercase;color:var(--ink-55);\">What holds across all sixteen<\u002Fdiv>\n    <p style=\"margin:0;font:var(--type-body);color:var(--ink-78);text-wrap:pretty;\">A stack that moves as one sways: it is a pile, and the higher a pill sits the further it swings, damping out in three diminishing swings. The motion is allowed to be funny, and the joke is always timing rather than a wink — a pill that is stuck and straining, one that leaves late and overshoots, a host that lands like it weighs something, a failed command that gets a third of the way round and thinks better of it. Nothing is ever cute about it: no bouncing, no cartoon squash beyond a hair, no character where a plain move would do. Nothing fades: a capsule is revealed by growing in length — both rounded ends belong to the shape, so neither is ever masked off — and text is wiped so the glyphs never stretch. Nothing loops: a thing plays once and settles, and replay is a button. Nothing idles: there is no spinner anywhere, because a running job is the unfold itself, slowed. Motion in the menu is linear — at those speeds an eased pill reads as a fault — while the page keeps the house curve, fast out and long settle. And every change of state is animated end to end: nothing on this sheet appears or vanishes on the spot.<\u002Fp>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:1400}}\">\nconst EASE = 'cubic-bezier(0,.9,.1,1)';\nconst LIN = 'linear';\n// Text is revealed by wiping — the glyphs must not stretch.\nconst WIPE = [\n  { clipPath: 'inset(0 100% 0 0)' },\n  { clipPath: 'inset(0 0 0 0)' }\n];\n\n// A stack that moves as one is top-heavy: it sways, and the higher a pill sits the further\n// it swings. The sway is hinged on the pill's visible right end and damps out in three\n// diminishing swings — never a loop, never a bounce back into motion.\nfunction wobble(el, row, delay, ms) {\n  const a = Math.min(0.9 + row * 0.7, 3.4);\n  el.style.transformOrigin = '100% 50%';\n  return el.animate([\n    { rotate: '0deg' },\n    { rotate: a + 'deg', offset: .3 },\n    { rotate: (-a * 0.55) + 'deg', offset: .58 },\n    { rotate: (a * 0.24) + 'deg', offset: .82 },\n    { rotate: '0deg' }\n  ], { duration: ms, delay: delay, easing: 'linear', fill: 'both', composite: 'add' });\n}\n\n// A capsule is revealed by GROWING IN LENGTH, never by masking: both rounded ends belong to\n// the shape, so the leading tip has to be there the whole way out.\nfunction grow(el, opts) {\n  // measure only after any held animation is cleared — a paused fill would report 0\n  el.getAnimations().forEach(a => a.cancel());\n  const w = el.getBoundingClientRect().width;\n  el.style.clipPath = 'none';\n  return el.animate(\n    [{ width: '0px' }, { width: w + 'px' }],\n    Object.assign({ fill: 'both' }, opts)\n  );\n}\n\nclass Component extends DCLogic {\n  componentDidMount() {\n    this.reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    // each tile plays itself once, as it comes into view\n    this.io = new IntersectionObserver(entries => {\n      entries.filter(e => e.isIntersecting).forEach((e, i) => {\n        const name = e.target.dataset.tile;\n        setTimeout(() => this.play(name), i * 160);\n        this.io.unobserve(e.target);\n      });\n    }, { threshold: 0.4 });\n    document.querySelectorAll('[data-tile]').forEach(el => this.io.observe(el));\n  }\n\n  componentW         el.style.transformOrigin = i % 2 === 0 ? '0 50%' : '100% 50%';\n        el.style.zIndex = String(50 - i);\n        A(el, [\n          { transform: 'translateY(' + under + 'px) rotate(' + dir + 'deg)', offset: 0 },\n          { transform: 'translateY(' + under + 'px) rotate(' + (dir * 0.1) + 'deg)', offset: 0.9 },\n          { transform: 'translateY(' + landed + 'px) rotate(0deg)', offset: 1 }\n        ], { duration: q(173), delay: q(i * 173), easing: LIN });\n      });\n    }\n\n    if (name === 'handoff') {\n      // The same stretch → snap → fly → jiggle as running a command. Length changes are\n      // real `width`/`left` (layout), never transform:scaleX — scaling a 999px-radius\n      // capsule non-uniformly squishes its round tips into ellipses. Transform carries only\n      // translateY and rotate here, neither of which distorts a circle. The last third of\n      // the fall swoops back to the crumb instead of continuing straight down.\n      this.els(name, 'pick').concat(this.els(name, 'sib')).forEach(el => { el.style.zIndex = '10'; });\n\n      const pick = this.els(name, 'pick')[0];\n      const STRETCH_MS = 220, SNAP_MS = 40, JIGGLE_MS = 90, FALL_MS = 300;\n      const leftPx0 = W * 0.30, pillWidth = W * 0.52;\n      const stretchedW = pillWidth * 1.06, shortW = pillWidth * 0.4;\n      const leftEdgeSpeed = (stretchedW - shortW) / SNAP_MS;\n      const rightEdgeConst = leftPx0 + stretchedW;\n      const leftAfterSnap = rightEdgeConst - shortW;\n      const flightDist = (W - 6) - rightEdgeConst;\n      const FLY_MS = Math.max(40, flightDist / leftEdgeSpeed);\n      const leftAfterFly = leftAfterSnap + flightDist;\n      const crumbW = W * 0.22, fallY = 20;\n      const total = STRETCH_MS + SNAP_MS + FLY_MS + JIGGLE_MS + FALL_MS;\n      const t = ms => ms / total;\n\n      const kf = [\n        { offset: 0, left: leftPx0 + 'px', width: pillWidth + 'px', transformOrigin: '100% 50%', transform: 'translateY(0px) rotate(0deg)', easing: 'linear' },\n ateX(0)' }\n      ], { duration: q(360), delay: q(i * step), easing: EASE }));\n    }\n\n    if (name === 'parallax') {\n      const sweep = 90;\n      A(this.els(name, 'back')[0], [{ transform: 'translateY(0)' }, { transform: 'translateY(-' + sweep * 0.2 + 'px)' }],\n        { duration: q(1400), easing: 'cubic-bezier(.4,0,.6,1)', direction: 'alternate', iterations: 2 });\n      A(this.els(name, 'mid')[0], [{ transform: 'translateY(0)' }, { transform: 'translateY(-' + sweep * 0.5 + 'px)' }],\n        { duration: q(1400), easing: 'cubic-bezier(.4,0,.6,1)', direction: 'alternate', iterations: 2 });\n      A(this.els(name, 'front')[0], [{ transform: 'translateY(0)' }, { transform: 'translateY(-' + sweep + 'px)' }],\n        { duration: q(1400), easing: 'cubic-bezier(.4,0,.6,1)', direction: 'alternate', iterations: 2 });\n    }\n\n    if (name === 'job') {\n      grow(this.els(name, 'fill')[0], { duration: q(2600), easing: LIN });\n    }\n  }\n\n  playAll() {\n    const names = ['unfold', 'stagger', 'extend', 'enter', 'leave', 'drop', 'cascade', 'handoff',\n      'struggle', 'perimeter', 'fail', 'flood', 'set', 'entry', 'parallax', 'job'];\n    names.forEach((n, i) => setTimeout(() => this.play(n), i * 140));\n  }\n\n  renderVals() {\n    const plays = {};\n    ['unfold', 'stagger', 'extend', 'enter', 'leave', 'drop', 'cascade', 'handoff',\n      'struggle', 'perimeter', 'fail', 'flood', 'set', 'entry', 'parallax', 'job']\n      .forEach(n => { plays[n] = () => this.play(n); });\n    return { plays, playAll: () => this.playAll(), note: 'Sixteen specimens · tap any tile' };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
