name: '🔎 Jules Review'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  review:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      # PR/issue text is attacker-controlled: it reaches the shell only through env vars (never
      # inline expression interpolation into the script) and is handed on as a step output.
      - name: 'Build review prompt'
        id: 'prompt'
        env:
          REPO: '${{ github.repository }}'
          NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          BODY: '${{ github.event.pull_request.body || github.event.issue.body }}'
          EXTRA: '${{ inputs.additional_context }}'
        run: |-
          {
            echo 'prompt<<JULES_PROMPT_EOF'
            echo "Please review pull request #${NUMBER} in ${REPO}."
            echo
            echo "**Title:** ${TITLE}"
            echo
            echo '**Description:**'
            echo "${BODY}"
            echo
            if [ -n "${EXTRA}" ]; then
              echo "**Additional context from requester:** ${EXTRA}"
              echo
            fi
            echo 'Review the diff for:'
            echo '- Correctness bugs and logic errors'
            echo '- Security issues (injection, permission leaks, unvalidated input at boundaries)'
            echo '- Performance regressions'
            echo '- Opportunities for simplification or reuse'
            echo
            echo 'Post your findings as a review comment on the PR. If you find fixable issues, open a follow-up PR with the corrections rather than blocking the review.'
            echo 'JULES_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 'Invoke Jules for PR review'
        uses: 'google-labs-code/jules-invoke@v1.0.0'
        with:
          prompt: '${{ steps.prompt.outputs.prompt }}'
          jules_api_key: '${{ secrets.JULES_API_KEY }}'
          include_last_commit: true
          include_commit_log: true
