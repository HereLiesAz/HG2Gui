name: Organize Guide Material

on:
  push:
    branches:
      - organize-guide-material
    paths:
      - scripts/organize_guide_material.py
      - .github/workflows/organize-guide-material.yml

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: organize-guide-material
          fetch-depth: 0

      - name: Restore explicit legacy storyboard handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/organize_guide_material.py")
          text = path.read_text(encoding="utf-8")

          start = text.index("def build_legacy(")
          end = text.index("\ndef build_project(", start)
          replacement = '''def build_legacy(manifest: dict, asset_index: dict[str, list[Path]]) -> None:
              legacy = []
              for name in ["ls", "echo", "ls_tangent"]:
                  frames = sorted(
                      path
                      for path in DOCS.glob(f"{name}_clip_*_*.png")
                      if re.search(r"_(start|end)\\.png$", path.name)
                  )
                  if not frames:
                      continue

                  numbers = sorted(
                      {
                          int(match.group(1))
                          for frame in frames
                          if (match := re.search(r"_clip_(\\d{2})_", frame.name))
                      }
                  )
                  anim_dir = OUT / "animations/legacy" / name
                  write(
                      anim_dir / "animation.md",
                      "\\n".join([
                          f"# Legacy/incomplete animation — `{name}`",
                          "",
                          "Explicit per-scene start/end storyboard images exist in the repository, but this animation is not represented by a current 5-second production packet.",
                          "",
                          "The clip boundary pairs are preserved here without promoting the sequence to canonical.",
                      ]),
                  )

                  storyboard_sections = [
                      f"# Storyboard — legacy `{name}`",
                      "",
                      "Each scene has explicit `_start` and `_end` storyboard files in the source repository.",
                      "Those files are normalized to `frames/start.png` and `frames/end.png` while their original provenance remains recorded.",
                      "",
                  ]
                  scene_records = []

                  for number in numbers:
                      scene_dir = anim_dir / "scenes" / f"{number:02d}"
                      start_name = f"{name}_clip_{number:02d}_start.png"
                      end_name = f"{name}_clip_{number:02d}_end.png"
                      write(
                          scene_dir / "scene.md",
                          (
                              f"# Scene {number:02d}\\n\\n"
                              f"**Start frame:** `{start_name}`\\n\\n"
                              f"**End frame:** `{end_name}`\\n"
                          ),
                      )

                      start_boundary = materialize_boundary(
                          start_name,
                          "start",
                          scene_dir,
                          asset_index,
                          "explicit_legacy_clip_boundary",
                      )
                      end_boundary = materialize_boundary(
                          end_name,
                          "end",
                          scene_dir,
                          asset_index,
                          "explicit_legacy_clip_boundary",
                      )
                      boundaries = [start_boundary, end_boundary]
                      write_frames_readme(
                          scene_dir,
                          boundaries,
                          "Boundary roles come directly from the source `_start` / `_end` filenames.",
                      )
                      reference_readme(scene_dir)

                      storyboard_sections += [
                          storyboard_scene_section(
                              number,
                              (
                                  f"## Cut {number:02d}\\n\\n"
                                  f"Explicit boundary pair: `{start_name}` → `{end_name}`."
                              ),
                              boundaries,
                          ),
                          "",
                      ]
                      scene_records.append({
                          "scene": number,
                          "text": rel(scene_dir / "scene.md"),
                          "storyboard": {
                              "start": start_boundary,
                              "end": end_boundary,
                          },
                      })

                  write(anim_dir / "storyboard.md", "\\n".join(storyboard_sections))
                  legacy.append({
                      "folder": rel(anim_dir),
                      "name": name,
                      "storyboard": rel(anim_dir / "storyboard.md"),
                      "scenes": scene_records,
                  })

              manifest["legacy_animations"] = legacy
          '''
          replacement = "\n".join(
              line[12:] if line.startswith("            ") else line
              for line in replacement.splitlines()
          ) + "\n"
          text = text[:start] + replacement + text[end + 1:]

          old = (
              "Tangent and legacy sources generally provide one ordered still per cut rather than explicit START/END pairs. "
              "Those stills are treated as cut-end boundaries and the previous still is reused as the following cut's inferred start. "
              "The first cut's start remains explicitly unresolved where no preceding still exists."
          )
          new = (
              "Tangent sources provide one ordered still per cut rather than explicit START/END pairs. "
              "Those stills are treated as cut-end boundaries and the previous still is reused as the following cut's inferred start. "
              "The first tangent cut's start remains explicitly unresolved where no preceding still exists.\\n\\n"
              "Legacy `ls`, `echo`, and `ls_tangent` clip sets already provide explicit `_start` and `_end` files per scene; "
              "those are copied directly into each scene's `frames/` folder."
          )
          if old in text:
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Organize Guide material
        run: python3 scripts/organize_guide_material.py

      - name: Commit organized material
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/organize_guide_material.py docs/guide
          if git diff --cached --quiet; then
            echo "Guide material is already organized."
            exit 0
          fi
          git commit -m "docs: restore explicit Guide storyboard boundaries [guide-organized]"
          git push origin HEAD:organize-guide-material
