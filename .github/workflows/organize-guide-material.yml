name: Organize Guide Material

on:
  push:
    branches:
      - organize-guide-material
    paths:
      - scripts/organize_guide_material.py
      - .github/workflows/organize-guide-material.yml

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: organize-guide-material
          fetch-depth: 0

      - name: Organize Guide material
        run: python3 scripts/organize_guide_material.py

      - name: Commit organized material
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/guide
          if git diff --cached --quiet; then
            echo "Guide material is already organized."
            exit 0
          fi
          git commit -m "docs: add Guide storyboards [guide-organized]"
          git push origin HEAD:organize-guide-material
