name: '🔀 Jules Triage'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-triage-${{ github.event_name }}-${{ github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  triage:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 7
    permissions:
      contents: 'read'
      issues: 'read'
      pull-requests: 'read'
    outputs:
      available_labels: '${{ steps.get_labels.outputs.available_labels }}'
    steps:
      - name: 'Get repository labels'
        id: 'get_labels'
        uses: 'actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3'
        with:
          script: |-
            const labels = [];
            for await (const response of github.paginate.iterator(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })) {
              labels.push(...response.data);
            }
            if (!labels || labels.length === 0) {
              core.setFailed('No issue labels found in this repository.')
            }
            const labelNames = labels.map(label => label.name).sort();
            core.setOutput('available_labels', labelNames.join(','));
            core.info(`Found ${labelNames.length} labels: ${labelNames.join(', ')}`);

      # Issue text is attacker-controlled: env vars only, handed on as a step output.
      - name: 'Build triage prompt'
        id: 'prompt'
        if: "${{ steps.get_labels.outputs.available_labels != '' }}"
        env:
          REPO: '${{ github.repository }}'
          NUMBER: '${{ github.event.issue.number }}'
          TITLE: '${{ github.event.issue.title }}'
          BODY: '${{ github.event.issue.body }}'
          LABELS: '${{ steps.get_labels.outputs.available_labels }}'
          EXTRA: '${{ inputs.additional_context }}'
        run: |-
          # Random heredoc delimiter, see jules-review.yml: a fixed one lets an issue body inject outputs.
          DELIM="JULES_PROMPT_$(cat /proc/sys/kernel/random/uuid)"
          {
            echo "prompt<<${DELIM}"
            echo 'Triage the following GitHub issue and apply the most appropriate labels from the available set.'
            echo
            printf '%s\n' "**Issue #${NUMBER}: ${TITLE}**"
            echo
            printf '%s\n' "${BODY}"
            echo
            echo '**Available labels (comma-separated):**'
            printf '%s\n' "${LABELS}"
            echo
            if [ -n "${EXTRA}" ]; then
              printf '%s\n' "**Additional context:** ${EXTRA}"
              echo
            fi
            echo "Apply labels to issue #${NUMBER} in ${REPO} using only labels from the available set above. Do not invent new labels. If the issue provides insufficient information to pick a label confidently, apply \"status/needs-triage\" if it exists, otherwise leave it unlabeled."
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: 'Invoke Jules for issue triage'
        if: "${{ steps.get_labels.outputs.available_labels != '' }}"
        uses: 'google-labs-code/jules-invoke@v1.0.0'
        with:
          prompt: '${{ steps.prompt.outputs.prompt }}'
          jules_api_key: '${{ secrets.JULES_API_KEY }}'
