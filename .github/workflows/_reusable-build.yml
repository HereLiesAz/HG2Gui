# Reusable build/publish workflow. Nothing in THIS repository calls it: since the "Centralize workflow
# bindings" change the thin caller workflows live in (and are dispatched from) HereLiesAz/workflows,
# which is why it is kept even though a search of this repo finds no `uses:` of it. Same for the composite
# actions under .github/actions (android-keystore is used below; play-publish and play-api-token are
# used by the central Play release flow; verify-android-signature is used below).
#
# UPDATE-CHANNEL CONTRACT (audit M-9). The app's in-app updater (AppUpdateChecker / UpdatePolicy.kt)
# polls the GitHub release tagged `latest-v<major>.<minor>` and installs only
# `hg2gui-playstore-release-<version>.apk` - a NON-debuggable build that is signed with the
# release key. A caller that publishes to that channel must therefore pass:
#   gradle_task:           :composeApp:assemblePlaystoreRelease
#   release_tag_prefix:    latest                      (tag = latest-v<major>.<minor>)
#   artifact_path_pattern: composeApp/build/outputs/apk/playstore/release/hg2gui-playstore-release-*.apk
#   signing_enabled:       true
# The debug build type is signed with the local debug key and is never signed with the release key
# (composeApp/build.gradle.kts); the guard step below also refuses a signed debug build outright.
name: Reusable Build

on:
  workflow_call:
    inputs:
      gradle_task:
        required: true
        type: string
      extra_gradle_args:
        required: false
        type: string
        default: ''
      artifact_name:
        required: true
        type: string
      artifact_path_pattern:
        required: true
        type: string
      release_tag_prefix:
        required: false
        type: string
        default: 'v'
      publish_to_release:
        required: false
        type: boolean
        default: false
      signing_enabled:
        required: false
        type: boolean
        default: false
      inject_google_services:
        required: false
        type: boolean
        default: false
    secrets:
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false
      KEYSTORE_PRIVATE:
        required: false
      KEYSTORE_RSA:
        required: false
      KEYSTORE_PUBLIC:
        required: false
      KEYSTORE_CHAIN:
        required: false
      # Arm the android-keystore action's "is this the key we expect" check. Optional only so that
      # callers can be migrated one at a time: when ALL THREE are unset the check is a no-op and the
      # run says so. Set at least KEYSTORE_SHA256 in the calling repository's secrets.
      KEYSTORE_SHA256:
        required: false
      KEYSTORE_SHA1:
        required: false
      KEYSTORE_OWNER:
        required: false
      GOOGLE_SERVICES_API_KEY:
        required: false
      PROJECT_ID:
        required: false
      CLIENT_ID:
        required: false
      ARCORE_API_KEY:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Inject Google Services
        if: ${{ inputs.inject_google_services }}
        env:
          GOOGLE_SERVICES_API_KEY: ${{ secrets.GOOGLE_SERVICES_API_KEY }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
        run: |
          if [ -f "composeApp/google-services.json.template" ]; then
            sed -e 's/{{\([^}]*\)}}/${\1}/g' composeApp/google-services.json.template | envsubst > composeApp/google-services.json
          fi
          echo "ARCORE_API_KEY=$ARCORE_API_KEY" >> local.properties

      # A signed build must be a release build: signing a debug build with the production key
      # is how debuggable APKs reached the update channel.
      - name: Refuse signed debug builds
        if: ${{ inputs.signing_enabled }}
        env:
          GRADLE_TASK: ${{ inputs.gradle_task }}
        run: |
          if printf '%s' "$GRADLE_TASK" | grep -qi 'debug'; then
            echo "::error::signing_enabled with a debug task ($GRADLE_TASK): debug builds must not be signed with the release key."
            exit 1
          fi

      - name: Prepare Android Keystore
        if: ${{ inputs.signing_enabled }}
        id: keystore
        uses: ./.github/actions/android-keystore
        with:
          keystore-private: ${{ secrets.KEYSTORE_PRIVATE }}
          keystore-rsa: ${{ secrets.KEYSTORE_RSA }}
          keystore-public: ${{ secrets.KEYSTORE_PUBLIC }}
          keystore-chain: ${{ secrets.KEYSTORE_CHAIN }}
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}
          expected-sha256: ${{ secrets.KEYSTORE_SHA256 }}
          expected-sha1: ${{ secrets.KEYSTORE_SHA1 }}
          expected-owner: ${{ secrets.KEYSTORE_OWNER }}

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compute Version
        run: ./gradlew -q printVersionEnv

      - name: Build with Gradle
        id: gradle-build
        env:
          # Signing secrets passed as environment variables — not as -P command-line args —
          # so they're not visible in /proc/pid/cmdline or runner audit logs.
          KEYSTORE_FILE: ${{ steps.keystore.outputs.keystore-path }}
          KEYSTORE_TYPE: ${{ steps.keystore.outputs.store-type }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_TASK: ${{ inputs.gradle_task }}
          EXTRA_GRADLE_ARGS: ${{ inputs.extra_gradle_args }}
        run: |
          # Inputs arrive through the environment, not inline expression interpolation; the
          # unquoted expansion is deliberate (a task list / argument list is word-split).
          # shellcheck disable=SC2086
          ./gradlew $GRADLE_TASK $EXTRA_GRADLE_ARGS -PversionBuild=$VERSION_BUILD -PversionName=$VERSION_NAME --build-cache

      # Prove the APK that was actually produced is signed, and by the key the keystore step
      # prepared (its SHA-256 output) - Gradle quietly emits an unsigned APK when signing env is
      # missing. Only the first matching file is inspected; one build task yields one signing identity.
      - name: Locate built artifact
        if: ${{ inputs.signing_enabled }}
        id: built
        env:
          PATTERN: ${{ inputs.artifact_path_pattern }}
        run: |
          # shellcheck disable=SC2086
          first="$(ls -1 $PATTERN 2>/dev/null | head -n1 || true)"
          echo "path=$first" >> "$GITHUB_OUTPUT"

      - name: Verify artifact signature
        if: ${{ inputs.signing_enabled }}
        uses: ./.github/actions/verify-android-signature
        with:
          artifact: ${{ steps.built.outputs.path }}
          expected-sha256: ${{ steps.keystore.outputs.sha256 }}

      # Only master/main ever gets an auto-bump commit - a feature branch that also bumped its
      # own copy of version.properties independently is exactly what produced a real merge
      # collision in this repo's history (branch and master both pushed bump commits from the
      # same starting point, and the merge had to silently pick one, discarding the other).
      # Restricting this to master makes the counter a single serialized sequence instead of one
      # that forks and has to be reconciled by luck during a merge.
      - name: Commit and push version bump
        if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        run: ./gradlew incrementAndPushVersion

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact_name }}-${{ env.VERSION_NAME }}
          path: ${{ inputs.artifact_path_pattern }}

      - name: Publish Release
        if: ${{ success() && inputs.publish_to_release && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG_PREFIX: ${{ inputs.release_tag_prefix }}
          ARTIFACT_PATH_PATTERN: ${{ inputs.artifact_path_pattern }}
        run: |
          TAG_NAME="${RELEASE_TAG_PREFIX}-v${VERSION_MAJOR}.${VERSION_MINOR}"
          git fetch origin --tags --force --quiet
          git tag -fa "$TAG_NAME" -m "Automated Release"
          git push origin "refs/tags/$TAG_NAME" --force

          # `gh release edit` only works on a release that already exists - it can't create one,
          # so the first build under a new TAG_NAME (e.g. right after a versionMajor/versionMinor
          # bump, since that's what TAG_NAME is keyed on) had no release to edit and failed the
          # whole step with "release not found".
          RELEASE_EXISTS=false
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
            gh release edit "$TAG_NAME" --prerelease --title "Latest Build ($TAG_NAME)" --notes "Auto-build from $GITHUB_SHA" --target "$GITHUB_SHA"
          else
            gh release create "$TAG_NAME" --prerelease --title "Latest Build ($TAG_NAME)" --notes "Auto-build from $GITHUB_SHA" --target "$GITHUB_SHA"
          fi

          # Every build's own versioned APK accumulates here on purpose - older builds are kept,
          # not deleted, so a previously-shared download link keeps working and the release page
          # is a real history. But GitHub's asset list sorts alphabetically, not by version or
          # date - "...0.7.9....apk" sorts *after* "...0.7.11....apk" - so with several versions
          # sitting side by side, nothing marks which one is actually current. Alongside each
          # file's own versioned name, also upload it under a second, fixed "-latest.apk" name
          # that always sits at the same spot in the list and always gets overwritten
          # (--clobber) with whatever just built - an unambiguous, permanent link to "whatever's
          # newest right now" that coexists with the growing version history instead of replacing
          # it.
          # shellcheck disable=SC2086
          for FILE in $ARTIFACT_PATH_PATTERN; do
            [ -f "$FILE" ] || continue
            gh release upload "$TAG_NAME" "$FILE" --clobber
            BASE="$(basename "$FILE")"
            ALIAS="$(echo "$BASE" | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.apk$/-latest.apk/')"
            if [ "$ALIAS" != "$BASE" ]; then
              ALIAS_PATH="$(dirname "$FILE")/$ALIAS"
              cp "$FILE" "$ALIAS_PATH"
              gh release upload "$TAG_NAME" "$ALIAS_PATH" --clobber
            fi
          done
