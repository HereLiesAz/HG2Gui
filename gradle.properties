android.enableR8.fullMode=false
android.useAndroidX=true

# Jetifier rewrites support-library references in dependencies. Nothing left in the tree needs
# it, and it slows every build, so it stays off.
android.enableJetifier=false

# The default 512 MiB heap is not enough to dex both flavours in one invocation once Compose is
# on the classpath — `assembleDebug` dies in mergeExtDex. D8 is the memory-hungry step.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

org.gradle.caching=true
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
