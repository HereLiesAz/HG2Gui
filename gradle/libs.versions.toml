[versions]
agp = "9.4.1"
# Pinned NDK, read by composeApp/build.gradle.kts and .github/workflows/ci.yml (the only two places that need it).
ndk = "29.0.14206865"
detekt = "1.23.8"
annotation = "1.11.0"
componentsResources = "1.12.1"
desugar_jdk_libs = "2.1.5"
foundation = "1.12.1"
kotlin = "2.4.21"
compose-multiplatform = "1.12.2"
androidx-activityCompose = "1.13.0"
androidx-appcompat = "1.8.0"
androidx-core-ktx = "1.19.1"
androidx-fragment = "1.9.1"
androidx-biometric = "1.1.0"
androidx-security-crypto = "1.1.0"
junit = "4.13.2"
listenablefuture = "9999.0-empty-to-avoid-conflict-with-guava"
localbroadcastmanager = "1.1.0"
material = "1.14.0"
material3 = "1.9.0"
okhttp = "5.5.0"
comparestring2 = "1.0.9"
kotlinx-serialization-json = "1.11.0"
anthropic-java = "2.71.0"
runtime = "1.12.1"
uiTooling = "1.12.2"
uiautomatorShell = "2.4.0"
composeHotReload = "1.2.0"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activityCompose" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core-ktx" }
androidx-fragment = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "androidx-fragment" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "androidx-biometric" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "androidx-security-crypto" }
androidx-localbroadcastmanager = { module = "androidx.localbroadcastmanager:localbroadcastmanager", version.ref = "localbroadcastmanager" }
components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "componentsResources" }
desugar_jdk_libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar_jdk_libs" }
foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "foundation" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
listenablefuture = { module = "com.google.guava:listenablefuture", version.ref = "listenablefuture" }
material = { module = "com.google.android.material:material", version.ref = "material" }
material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
comparestring2 = { group = "it.andreuzzi", name = "CompareString2", version.ref = "comparestring2" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
anthropic-java = { group = "com.anthropic", name = "anthropic-java", version.ref = "anthropic-java" }
runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "runtime" }
# Same release train as foundation/runtime (the Compose Multiplatform 1.12.1 line). ui-tooling below tracks
# its own, debug-only version (uiTooling) and may be ahead.
ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "foundation" }
ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "uiTooling" }
ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "uiTooling" }
androidx-uiautomator-shell = { group = "androidx.test.uiautomator", name = "uiautomator-shell", version.ref = "uiautomatorShell" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
jetbrainsCompose = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
composeHotReload = { id = "org.jetbrains.compose.hot-reload", version.ref = "composeHotReload" }